# 매일 디자인 매체(NN/g, Smashing, UX Collective, Figma, web.dev)의 새 글을 디스코드로 보내고,
# data/trends/ui/posts.json을 main에 커밋한다 → Vercel이 배포하면 트렌드 페이지의 "UI/UX 디자인 트렌드"가 갱신된다.
#
# 준비 (한 번만):
#  1. Secrets → Actions의 DISCORD_WEBHOOK_URL (트렌드 수집과 같은 값을 쓴다 · 없으면 알림만 건너뜀)
#  2. Settings → Actions → General → Workflow permissions를 "Read and write"로
#  3. main에 브랜치 보호(직접 push 금지)가 있으면 github-actions를 예외로 두어야 커밋된다
name: UI trends

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ui-trends # 두 실행이 동시에 posts.json을 고치지 않게
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile

      - run: node --test --import ./tests/setup/register.mjs tests/ui-trends.test.ts

      - name: Collect and notify
        run: node --import ./tests/setup/register.mjs scripts/collect-ui-trends.ts
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      # 전송이 중간에 실패해도 실행 — 이미 보낸 글이 내일 또 가지 않게
      - name: Commit posts.json
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trends/ui
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "data: UI 트렌드 갱신 $(date -u +%F)"
          git push
