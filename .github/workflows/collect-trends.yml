# 매달 지난달 언어 트렌드(GitHub) · 이번 달 채용공고 기술(Greenhouse)을 모아 PR을 열고 디스코드로 알린다.
# 확인 → PR 머지 = 반영 (Vercel이 배포). 이상하면 PR을 닫는다.
#
# 준비 (한 번만):
#  1. 저장소 Settings → Secrets → Actions에 DISCORD_WEBHOOK_URL 등록 (없으면 알림만 건너뜀)
#  2. Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests" 켜기
#  3. 이 파일이 기본 브랜치(main)에 있어야 schedule이 돈다
name: Collect trends

on:
  schedule:
    - cron: "0 0 2 * *" # 매달 2일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: Collect
        run: node --import ./tests/setup/register.mjs scripts/collect-trends.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md

      # 채용공고(Greenhouse) — 실패해도 GitHub 트렌드 PR은 연다
      - name: Collect jobs
        id: jobs
        continue-on-error: true
        run: node --import ./tests/setup/register.mjs scripts/collect-jobs.ts
        env:
          SUMMARY_FILE: ${{ runner.temp }}/jobs-summary.md

      # 면접 질문 주제 (공개 질문 모음 레포 문서 제목, 출처 기록) — 실패해도 나머지 PR은 연다
      - name: Collect interview themes
        continue-on-error: true
        run: node --import ./tests/setup/register.mjs scripts/collect-interview-themes.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY_FILE: ${{ runner.temp }}/interview-summary.md

      - name: Open PR
        id: pr
        run: |
          period=$(ls data/trends/github | sort | tail -1 | sed 's/\.json$//')
          branch="trends/$period"
          body="$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/summary.md" > "$body"
          [ -f "$RUNNER_TEMP/jobs-summary.md" ] && printf '\n\n---\n\n' >> "$body" && cat "$RUNNER_TEMP/jobs-summary.md" >> "$body"
          [ -f "$RUNNER_TEMP/interview-summary.md" ] && printf '\n\n---\n\n' >> "$body" && cat "$RUNNER_TEMP/interview-summary.md" >> "$body"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add data/trends
          git commit -m "data: 트렌드 수집 $period"
          git push -f origin "$branch"
          url=$(gh pr list --head "$branch" --state open --json url -q '.[0].url')
          [ -n "$url" ] || url=$(gh pr create --head "$branch" --title "data: 트렌드 수집 $period" --body-file "$body")
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 디스코드는 메시지당 2000자 제한 — 언어 트렌드 · 채용공고를 따로 보낸다
      - name: Notify Discord
        if: env.DISCORD_WEBHOOK_URL != ''
        run: |
          send() {
            content=$(printf '%s\n\n👉 확인 · 머지: %s' "$(head -c 1700 "$1")" "${{ steps.pr.outputs.url }}")
            jq -n --arg c "$content" '{content: $c}' | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
          }
          send "$RUNNER_TEMP/summary.md"
          if [ -f "$RUNNER_TEMP/jobs-summary.md" ]; then
            send "$RUNNER_TEMP/jobs-summary.md"
          elif [ "${{ steps.jobs.outcome }}" = "failure" ]; then
            jq -n --arg c "⚠️ 채용공고 수집 실패 (언어 트렌드는 정상): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $c}' \
              | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
          fi

      - name: Notify failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          jq -n --arg c "⚠️ 트렌드 수집 실패: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{content: $c}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK_URL"
